name: News Bot

on:
  schedule:
    - cron: '0 23 * * *'  # 한국 아침 8~9시쯤 (UTC 기준)
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install
        run: pip install feedparser requests

      - name: Run
        run: python bot.py
